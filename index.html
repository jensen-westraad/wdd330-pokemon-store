<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Store</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <h1>Pokémon TCG Store</h1>
    <label for="search">Search cards</label>
    <label for="sort">Sort by</label>
    <select id="sort">
        <option value="name-asc">Name (A–Z)</option>
        <option value="price-asc">Price (low to high)</option>
        <option value="price-desc">Price (high to low)</option>
    </select>
    <label for="set-filter">Set</label>
    <select id="set-filter">
        <option value="">All sets</option>
    </select>
    
    <label for="rarity-filter">Rarity</label>
    <select id="rarity-filter">
        <option value="">All rarities</option>
    </select>
    <input type="search" id="search" placeholder="Search by name">
    <div id="card-list"></div>
    <script type="module" src="/js/main.js"></script>
</body>

</html>
